{% extends 'base.html' %}
{% load static %}
{% load i18n %}
{% load humanize %}
{% block title %}Home{% endblock %}
{% block style %}
    <link rel="stylesheet" type="text/css" href="{% static 'assets/w2ui/w2ui-2.0.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/paramquery/pqgrid.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/paramquery/pqgrid.ui.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/paramquery/themes/gray/pqgrid.css' %}">
{% endblock %}
{% block body %}
    <main id="main" class="" style="width: 100vw; height: 90vh;"></main>
{% endblock %}
{% block script %}
    <script src="{% static 'assets/paramquery/pqgrid.min.js' %}"></script>
    <script src="{% static 'assets/paramquery/jsZip-2.5.0/jszip.min.js' %}"></script>
    <script src="{% static 'assets/paramquery/jszip-utils-0.0.2/jszip-utils.min.js' %}"></script>
    <script src="{% static 'assets/paramquery/localize/pq-localize-fr.js' %}"></script>
    <script type="module">
        import {
            w2layout,
            w2sidebar,
            w2alert,
            w2grid,
            query
        } from "{% static 'assets/w2ui/w2ui-2.0.es6.min.js' %}";


        let configTable = function (event) {
            let table;
            switch (event.target) {
                case 1:
                    table = config.table1
                    break;
                case 2:
                    table = config.table2
                    break;
                case 3:
                    table = config.table3
                    break;
                case 4:
                    table = config.table4
                    break;
                case 5:
                    table = config.table5
                    break;
                case 6:
                    table = config.table6
                    break;
                case 7:
                    table = config.table7
                    break;
                case 8:
                    table = config.table8
                    break;
                default:
                    table = config.table1
                    break;

            }
            return new w2grid(table)
        }

        let config = {
            layout: {
                name: 'layout',
                overflow: 'auto',
                resizable: false,
                padding: 0,
                panels: [
                    {type: 'left', size: 100, resizable: true, minSize: 35},
                    {type: 'main', size: 550, overflow: 'hidden'}
                ]
            },
            sidebar: {
                name: 'sidebar',
                flatButton: true,
                nodes: [
                    {
                        id: 'general',
                        text: 'General',
                        group: true,
                        expanded: true,
                        groupShowHide: false,
                        nodes: [
                            {id: '1', text: 'AI', icon: 'fas fa-list-alt', selected: true},
                            {id: '2', text: 'ANDR', icon: 'fas fa-list-alt'},
                            {id: '3', text: 'ADR', icon: 'fas fa-list-alt'},
                            {id: '4', text: 'PSV', icon: 'fas fa-list-alt'},
                            {id: '5', text: 'MV', icon: 'fas fa-list-alt'},
                            {id: '6', text: 'SVT', icon: 'fas fa-list-alt'},
                            {id: '7', text: 'PL', icon: 'fas fa-list-alt'},
                            {id: '8', text: 'PLP', icon: 'fas fa-list-alt'},
                        ],
                        onCollapse(event) {
                            event.preventDefault()
                        },

                    }
                ],
                onFlat(event) {
                    layout.sizeTo('left', (event.detail.goFlat ? 35 : 100), true)
                },
                onRender(event) {
                    let table = configTable(event)
                    layout.html('main',table)
                },
                onClick(event) {
                    let table = configTable(event)
                    layout.html('main',table)
                }
            },
            table1: {
                name: 'grid1',
                columns: [
                    {field: 'fname', text: 'First Name', size: '180px'},
                    {field: 'lname', text: 'Last Name', size: '180px'},
                    {field: 'email', text: 'Email', size: '40%'},
                    {field: 'sdate', text: 'Start Date', size: '120px'}
                ]
            },
            table2: {},
            table3: {},
            table4: {},
            table5: {},
            table6: {},
            table7: {},
            table8: {},

        }


        let layout = new w2layout(config.layout);
        let sidebar = new w2sidebar(config.sidebar);
        {#let table1 = new w2grid(config.table1)#}


        layout.render('#main');
        layout.html('left', sidebar)
        layout.html('top', toolbar)


        window.showAlert = function (message) {
            w2alert(message)
                .ok(() => {
                    console.log(message)
                })
        }


        document.addEventListener('DOMContentLoaded', function () {
            const societeField = document.querySelector('#id_societe');
            const targetField = document.querySelector('#id_target');
            const form = document.querySelector('#FormSearch');

            societeField.addEventListener('change', handleFormChange);
            targetField.addEventListener('change', handleFormChange);

            function handleFormChange() {
                if (societeField.value && targetField.value) {
                    form.submit();
                }
            }
        });


    </script>
{% endblock %}
