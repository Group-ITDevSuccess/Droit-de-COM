        function table(value, title, columns, columnsGroup) {
            return {
                name: value,
                dataType: 'JSON',
                postData: {
                    canevas: value,
                    uid: '{{ uid }}',
                    target: '{{ target }}',
                },
                {#recid: 'uid',#}
                method: 'GET',
                limit: 10000,
                {#autoLoad: true,#}
                advanceOnEdit: true,
                liveSearch: true,
                multiSearch: true,
                multiSelect: true,
                showExtraOnSearch: 1,
                header: title,
                msgNotJSON: "Les données reçu n'est pas en JSON",
                msgEmpty: 'Aucun donnée',
                msgHTTPError: 'Erreur HTTP',
                msgNeedReload: 'Reload Nécessaire...',
                msgRefresh: 'Rafraichissement...',
                msgServerError: 'Erreur Serveur !',
                buttons: {
                    'reload': {
                        type: 'button',
                        img: 'icon-reload',
                        tooltip: w2utils.lang('Rafraichir les données')
                    },
                    'columns': {
                        tooltip: w2utils.lang('Afficher/Cacher colonne'),
                    },
                },
                show: {
                    header: true,
                    footer: true,
                    toolbar: true,
                    lineNumbers: true,
                    orderColumn: true,
                    columnMenu: true,
                    columnHeaders: true,
                    emptyRecords: true,
