{% extends 'base.html' %}
{% load static %}
{% load i18n %}
{% load humanize %}
{% block title %}Home{% endblock %}
{% block style %}
    <link rel="stylesheet" type="text/css" href="{% static 'assets/w2ui/w2ui-2.0.min.css' %}">
{% endblock %}
{% block body %}
    <main id="main" class="" style="width: 100vw; height: 85vh;"></main>
{% endblock %}
{% block script %}
    <script src="{% static 'dist/js/jquery.min.js' %}"></script>
    <script type="module">
        import {
            w2grid,
            w2layout,
            w2sidebar,
            w2utils,
            w2alert,
            query
        } from "{% static 'assets/w2ui/w2ui-2.0.es6.min.js' %}";

        let semaineActuel = 16
        let typeHebdo = [
            {id: 1, text: 'Import'},
            {id: 2, text: 'Local'},
        ]

        function grid(value, title, columns, columnsGroup, searchable, searchMap) {
            return {
                name: value,
                dataType: 'JSON',
                postData: {
                    category: `${value}`
                },
                recid: 'uid',
                method: 'GET',
                autoLoad: true,
                advanceOnEdit: true,
                liveSearch: true,
                multiSearch: true,
                multiSelect: true,
                showExtraOnSearch: 1,
                header: title,
                msgNotJSON: "Les données reçu n'est pas en JSON",
                msgEmpty: 'Aucun donnée',
                msgHTTPError: 'Erreur HTTP',
                msgNeedReload: 'Reload Nécessaire...',
                msgRefresh: 'Rafraichissement...',
                msgServerError: 'Erreur Serveur !',
                sortData: [{field: 'department_name', direction: 'asc'}],
                buttons: {
                    'reload': {
                        type: 'button',
                        img: 'icon-reload',
                        tooltip: w2utils.lang('Rafraichir les données')
                    },
                    'columns': {
                        tooltip: w2utils.lang('Afficher/Cacher colonne'),
                    },
                },
                show: {
                    header: true,
                    footer: true,
                    toolbar: true,
                    lineNumbers: true,
                    orderColumn: true,
                    columnMenu: true,
                    columnHeaders: true,
                    emptyRecords: true,
                    selectionBorder: true,
                    recordTitles: true,
                    searchAll: true,
                    searchHiddenMsg: true,
                    searchLogic: true,
                    searchSave: true,
                    skipRecords: true,
                    toolbarColumns: true,
                    statusRange: true,
                    statusBuffered: true,
                    statusRecordID: true,
                    statusSelection: true,
                    statusResponse: true,
                    statusSearch: true,
                },
                operatorsMap: {
                    'text': 'text',
                    'int': 'number',
                    'float': 'number',
                    'money': 'number',
                    'currency': 'number',
                    'percent': 'number',
                    'hex': 'hex',
                    'alphanumeric': 'text',
                    'color': 'color',
                    'date': 'date',
                    'time': 'date',
                    'datetime': 'date',
                    'list': 'list',
                    'combo': 'text',
                    'enum': 'enum',
                    'file': 'enum',
                    'select': 'list',
                    'radio': 'list',
                    'checkbox': 'list',
                    'toggle': 'list'
                },
                searchMap: searchMap,
                columnTooltip: 'bottom',
                tooltip: w2utils.locale('{% static 'assets/w2ui/locale/fr-fr.json' %}'),
                toolbar: {
                    onClick(event) {
                        if (
                            event.target !== 'w2ui-add' &&
                            event.target !== 'w2ui-column-on-off' &&
                            event.target !== 'w2ui-reload' &&
                            event.target !== 'w2ui-save' &&
                            event.target !== 'w2ui-delete'
                        ) {
                            let name = event.owner.name
                            let data;
                            if (name === '2080_toolbar') {
                                data = grid2080
                            } else if (name === '8020_toolbar') {
                                data = grid8020
                            }
                            data.postData = {
                                category: `${value}`,
                                section: event.target
                            }
                            data.reload()
                            w2utils.notify(`Hebdo "${event.detail.item.text}" Sélectionnez`)
                        }

                    }
                },
                searches: searchable,
                columnGroups: columnsGroup,
                columns: columns
            }
        }

        let config = {
            layout: {
                name: 'layout',
                overflow: 'auto',
                resizable: false,
                padding: 0,
                panels: [
                    {type: 'left', size: 100, resizable: true, minSize: 35},
                    {type: 'main', size: 550, overflow: 'hidden'}
                ]
            },
            sidebar: {
                name: 'sidebar',
                flatButton: true,
                nodes: [
                    {
                        id: 'general',
                        text: 'General',
                        group: true,
                        expanded: true,
                        groupShowHide: false,
                        nodes: [
                            {id: '1', text: 'AI', icon: 'fas fa-list-alt', selected: true},
                            {id: '2', text: 'ANDR', icon: 'fas fa-list-alt'},
                            {id: '3', text: 'ADR', icon: 'fas fa-list-alt'},
                            {id: '4', text: 'PSV', icon: 'fas fa-list-alt'},
                            {id: '5', text: 'MV', icon: 'fas fa-list-alt'},
                            {id: '6', text: 'SVT', icon: 'fas fa-list-alt'},
                            {id: '7', text: 'PL', icon: 'fas fa-list-alt'},
                            {id: '8', text: 'PLP', icon: 'fas fa-list-alt'},
                            {id: 'html', text: 'Synthèse', icon: 'fas fa-list-alt'},
                        ],
                        onCollapse(event) {
                            event.preventDefault()
                        }
                    }
                ],
                onFlat(event) {
                    layout.sizeTo('left', (event.detail.goFlat ? 35 : 100), true)
                },
            },
            grid1: grid(
                '1',
                "Achats Immobilisés: 203 204 205 207 208/ 211 212 213 215 218",
                [
                    {
                        field: 'department_name',
                        text: 'Département',
                        sortable: true,
                        size: '120px',
                        resizable: true,
                        editable: {type: 'text'},
                        frozen: true,
                        searchable: {operator: 'contains'}
                    },
                    {
                        field: 'family_name',
                        text: 'Famille',
                        sortable: true,
                        size: '120px',
                        resizable: true,
                        frozen: true,
                        editable: {type: 'text'},
                        searchable: {operator: 'contains'}
                    },
                    {
                        field: 'article',
                        text: 'Article',
                        sortable: true,
                        size: '120px',
                        resizable: true,
                        frozen: true,
                        editable: {type: 'text'},
                        searchable: {operator: 'contains'},
                        clipboardCopy: "Copier le N° Article"
                    },
                    {
                        field: 'designation',
                        text: 'Désignation',
                        size: '150px',
                        sortable: true,
                        resizable: true,
                        frozen: true,
                        editable: {type: 'text'},
                        searchable: {operator: 'contains'}
                    },
                    {
                        field: 'type',
                        text: 'Import / Local',
                        size: '75px',
                        sortable: true,
                        resizable: true,
                        frozen: true,
                        editable: {
                            type: 'list', items: typeHebdo, showAll: true, openOnFocus: true, align: 'right'
                        },
                        render(record, extra) {
                            switch (parseInt(extra.value)) {
                                case 1:
                                    extra.value = {id: 1, text: 'Import'}
                                    break
                                case 2:
                                    extra.value = {id: 2, text: 'Local'}
                                    break
                            }
                            return extra.value?.text || '';
                        }
                    },
                    {
                        field: 'qte_pta',
                        text: 'Qté',
                        size: '100px',
                        align: 'right',
                        editable: {
                            type: 'money',
                            currencyPrefix: "",
                            currencySuffix: "",
                            currencyPrecision: 2,
                            groupSymbol: " ",
                            decimalSymbol: ".",
                        },
                        render: 'money'
                    },
                    {
                        field: 'pmp_pta',
                        text: 'PMP',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money'},
                        render: 'money'
                    },
                    {
                        field: 'pdv_pta',
                        text: 'PDV',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money'},
                        render: 'money'
                    },
                    {
                        field: 'marge_pta',
                        text: 'Marge',
                        size: '100px',
                        align: 'right',
                        render: function (record, extra) {
                            if (record.pdv_pta && record.pmp_pta) {
                                return parseFloat(record.pdv_pta) - parseFloat(record.pmp_pta);
                            }
                        }
                    },
                    {
                        field: 'pourcentage_marge_pta',
                        text: '% marge',
                        size: '100px',
                        align: 'right',
                        render: function (record, extra) {
                            if (record.pdv_pta && record.pmp_pta) {
                                return (parseFloat(record.pdv_pta) - parseFloat(record.pmp_pta)) / parseFloat(record.pdv_pta) + ' %';
                            }
                        }
                    },
                    {
                        field: 'ca_ht_pta',
                        text: 'CA HT',
                        size: '100px',
                        align: 'right',
                        render: function (record, extra) {
                            if (record.qte_pta && record.pdv_pta) {
                                return parseFloat(record.pdv_pta) * parseFloat(record.pmp_pta);
                            }
                        }
                    },
                    {
                        field: 'qte_realisation',
                        text: 'Qté',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money',},
                        render: 'money'
                    },
                    {
                        field: 'pmp_realisation',
                        text: 'PMP',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money',},
                        render: 'money'
                    },
                    {
                        field: 'pdv_realisation',
                        text: 'PDV',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money',},
                        render: 'money'
                    },
                    {
                        field: 'marge_realisation',
                        text: 'Marge',
                        size: '100px',
                        align: 'right',
                        render: function (record, extra) {
                            if (record.pdv_realisation && record.pmp_realisation) {
                                return parseFloat(record.pdv_realisation) - parseFloat(record.pmp_realisation);
                            }
                        }
                    },
                    {
                        field: 'pourcentage_marge_realisation',
                        text: '% marge',
                        size: '100px',
                        align: 'right',
                        render: function (record, extra) {
                            if (record.pdv_realisation && record.pmp_realisation) {
                                return (parseFloat(record.pdv_realisation) - parseFloat(record.pmp_realisation)) / parseFloat(record.pdv_realisation) + ' %';
                            }
                        }
                    },
                    {
                        field: 'ca_ht_realisation',
                        text: 'CA HT Rea',
                        size: '100px',
                        align: 'right',
                        render: function (record, extra) {
                            if (record.qte_realisation && record.pdv_realisation) {
                                return parseFloat(record.pdv_realisation) * parseFloat(record.pmp_realisation);
                            }
                        }
                    },
                    {
                        field: 'stock_realisation',
                        text: 'Stock au 1301',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money',},
                        render: 'money'
                    },

                    // Variable
                    {
                        field: 'ecart_qte',
                        text: 'Ecart Qte',
                        size: '100px',
                        align: 'right',
                        render: function (record, extra) {
                            if (record.qte_realisation && record.qte_pta) {
                                return parseFloat(record.qte_pta) - parseFloat(record.qte_realisation);
                            }
                        }
                    },
                    {
                        field: 'pourcentage_ecart_qte',
                        text: 'Ecart Qte (%)',
                        size: '100px',
                        align: 'right',
                        render: function (record, extra) {
                            if (record.qte_realisation && record.qte_pta) {
                                return parseFloat(record.qte_pta) / (parseFloat(record.qte_realisation) - 1);
                            }
                        }
                    },
                    {
                        field: 'ecart_ca_ht',
                        text: 'Ecart CA HT (Valeur)',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money',},
                        render: {type: 'money'}
                    },
                    {
                        field: 'pourcentage_ecart_ca_ht',
                        text: 'Ecart CA HT (%)',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money',},
                        render: {type: 'money'}
                    },
                    {
                        field: 'stock_prevision',
                        text: 'Stock Prev',
                        size: '100px',
                        align: 'right',
                        editable: {type: 'money',},
                        render: {type: 'money'}
                    },
                ],
                [
                    {text: '', main: true},
                    {text: '', main: true},
                    {text: 'INFORMATION', span: 3, style: "background-color: green; color: #fff", frozen: true},
                    {text: 'PTA', style: "background-color: #FFC000; color: #fff;", span: 6,},
                    {text: 'REALISATION ', style: "background-color: #5B9BD5; color: #fff;", span: 6},
                    {text: 'VARIATION ', style: "background-color: #A5A5A5; color: #fff;", span: 6},
                ],
                [
                    {type: 'text', field: 'department_name', label: 'Département'},
                    {type: 'text', field: 'family_name', label: 'Famille'},
                    {type: 'text', field: 'article', label: 'Article'},
                    {type: 'text', field: 'designation', label: 'Désignation'},
                ],
                {
                    department_name: 'department',
                    family_name: 'family',
                    article: 'article',
                    designation: 'designation',
                }
            ),
            grid2: grid(
                '2',
                "Achats non destinés à la revente: 601 602 604 605 606 608 609",
                [],
                [],
                [],
                {}
            ),
            grid3: grid(
                '3',
                "Achats (de marchandises) destinés à la revente: 607",
                [],
                [],
                [],
                {}
            ),
            grid4: grid(
                '4',
                "Prestation de services vendues 706",
                [],
                [],
                [],
                {}
            ),
            grid5: grid(
                '5',
                "Marchandises vendues: 707",
                [],
                [],
                [],
                {}
            ),
            grid6: grid(
                '6',
                "Sommes versées à des Tiers: 61 62",
                [],
                [],
                [],
                {}
            ),
            grid7: grid(
                '7',
                "Produits locaux: 601",
                [],
                [],
                [],
                {}
            ),
            grid8: grid(
                '8',
                "Produits locaux par produits: 601",
                [],
                [],
                [],
                {}
            ),

        }


        let layout = new w2layout(config.layout);
        let sidebar = new w2sidebar(config.sidebar);

        let grid1 = new w2grid(config.grid1);
        let grid2 = new w2grid(config.grid2);
        let grid3 = new w2grid(config.grid3);
        let grid4 = new w2grid(config.grid4);
        let grid5 = new w2grid(config.grid5);
        let grid6 = new w2grid(config.grid6);
        let grid7 = new w2grid(config.grid7);
        let grid8 = new w2grid(config.grid8);


        layout.render('#main');
        layout.html('left', sidebar)
        layout.html('main', grid1)

        {#grid2080.localSearch()#}
        {#grid8020.localSearch()#}

        window.showAlert = function (message) {
            w2alert(message)
                .ok(() => {
                    console.log(message)
                })
        }

        sidebar.on('*', function (event) {
            if (event.type === 'click') {
                let grids;

                switch (event.target) {
                    case 2:
                        grids = grid2
                        break;
                    case 3:
                        grids = grid3
                        break;
                    case 4:
                        grids = grid4
                        break;
                    case 5:
                        grids = grid5
                        break;
                    case 6:
                        grids = grid6
                        break;
                    case 7:
                        grids = grid7
                        break;
                    case 8:
                        grids = grid8
                        break;
                    case 'html':
                         layout.html('main', '<div style="padding: 10px">Page de Synthèse</div>')
                            query(layout.el('main')).removeClass('w2ui-grid').css('border-left', '1px solid #efefef')
                        break
                    default:
                        grids = grid1
                        break;
                }
                layout.html('main', grids)

                {#console.log('Last Event: ' + event.type + ' Target: ' + event.target);#}
                {#console.log(event);#}
            }
        })

    </script>
{% endblock %}
